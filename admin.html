<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Management - Shiridi Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen p-4 font-sans">

    <!-- Auth Lock Screen Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-gray-900/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white border border-gray-200 p-6 rounded-2xl max-w-sm w-full shadow-2xl space-y-4 text-gray-900">
            <div class="text-center">
                <span class="text-3xl">🔒</span>
                <h2 class="text-xl font-bold mt-2">Admin Panel Lock</h2>
                <p class="text-xs text-gray-500">Enter User ID & Password to continue</p>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block mb-1 font-bold">User ID</label>
                    <input type="text" id="auth-userid" class="w-full bg-gray-50 border border-gray-300 rounded p-2.5">
                </div>
                <div>
                    <label class="block mb-1 font-bold">Password</label>
                    <input type="password" id="auth-password" class="w-full bg-gray-50 border border-gray-300 rounded p-2.5">
                </div>
                <button onclick="attemptLogin('admin')" class="w-full bg-red-700 hover:bg-red-800 text-white font-extrabold py-3 rounded uppercase text-xs">Verify Access</button>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto">
        <div class="bg-red-700 text-white p-5 rounded-xl shadow-md mb-6 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <img id="admin-header-logo" src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=120" class="w-14 h-14 object-cover rounded-xl border border-white/20 bg-white shrink-0" alt="Branding Logo">
                <div>
                    <h1 id="admin-header-title" class="text-2xl font-bold tracking-tight">Sai Krishna Caterers Menu Admin</h1>
                    <p class="text-xs text-red-100 uppercase tracking-widest font-semibold mt-0.5">Shiridi Project Control Hub</p>
                </div>
            </div>
            <button onclick="logout()" class="bg-red-900/50 hover:bg-red-900 text-white text-xs font-bold px-3 py-1.5 rounded-lg border border-red-500/30">Logout 🚪</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="space-y-6">
                <!-- App Identity Settings -->
                <div class="bg-white p-5 rounded-xl shadow border border-gray-200">
                    <h2 class="text-sm font-extrabold uppercase text-gray-800 mb-3 tracking-wider border-b pb-2 flex items-center">⚙️ App Identity & Payment Settings</h2>
                    <div class="space-y-3 text-xs">
                        <div><label class="block mb-1 text-gray-700 font-bold">Hotel / Title Name</label><input type="text" id="setup-hotel-name" class="w-full bg-gray-50 border border-gray-300 rounded p-2"></div>
                        <div><label class="block mb-1 text-gray-700 font-bold">Hotel Logo Image URL</label><input type="text" id="setup-hotel-image" class="w-full bg-gray-50 border border-gray-300 rounded p-2"></div>
                        <div><label class="block mb-1 text-gray-700 font-bold">App Banner Image URL</label><input type="text" id="setup-banner-image" class="w-full bg-gray-50 border border-gray-300 rounded p-2"></div>
                        <hr class="my-2">
                        <p class="text-[11px] font-black uppercase text-red-700">💳 UPI Payment Configuration</p>
                        <div><label class="block mb-1 text-gray-700 font-bold">UPI ID (VPA)</label><input type="text" id="setup-upi-id" class="w-full bg-gray-50 border border-gray-300 rounded p-2"></div>
                        <div><label class="block mb-1 text-gray-700 font-bold">Merchant Name</label><input type="text" id="setup-merchant-name" class="w-full bg-gray-50 border border-gray-300 rounded p-2"></div>
                        <div><label class="block mb-1 text-gray-700 font-bold">Custom QR Code Image URL</label><input type="text" id="setup-qr-image" class="w-full bg-gray-50 border border-gray-300 rounded p-2"></div>
                        <button onclick="saveAppIdentitySettings()" class="w-full bg-gray-800 text-white font-bold py-2.5 rounded uppercase text-[11px] mt-1 shadow-sm">Update All Settings</button>
                    </div>
                </div>

                <!-- Add/Edit Form -->
                <div class="bg-white p-5 rounded-xl shadow border border-gray-200">
                    <h2 id="form-title" class="text-sm font-extrabold uppercase text-red-700 mb-4 tracking-wider">✨ Add New Food Item</h2>
                    <input type="hidden" id="item-id">
                    <div class="space-y-4 text-xs">
                        <div><label class="block mb-1 text-gray-700 font-bold">Item Name</label><input type="text" id="menu-name" class="w-full bg-gray-50 border border-gray-300 rounded p-2.5"></div>
                        <div><label class="block mb-1 text-gray-700 font-bold">Price (₹)</label><input type="text" id="menu-price" class="w-full bg-gray-50 border border-gray-300 rounded p-2.5"></div>
                        <div><label class="block mb-1 text-gray-700 font-bold">Image URL</label><input type="text" id="menu-image" class="w-full bg-gray-50 border border-gray-300 rounded p-2.5"></div>
                        <div class="pt-2 flex gap-2">
                            <button id="btn-save" onclick="saveItem()" class="flex-1 bg-red-700 text-white font-bold py-2.5 rounded uppercase">Save Item</button>
                            <button id="btn-cancel" onclick="resetForm()" class="bg-gray-200 text-gray-700 px-3 py-2.5 rounded font-bold hidden">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="md:col-span-2 bg-white p-5 rounded-xl shadow border border-gray-200">
                <h2 class="text-sm font-extrabold uppercase text-gray-800 mb-4 border-b pb-2 tracking-wider">📋 Current Live Items</h2>
                <div id="admin-menu-container" class="space-y-3 max-h-[78vh] overflow-y-auto pr-1"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBjG-vnr8B4-tQpPyflqdY99OBvLuZRkoc",
            authDomain: "shirdi-project.firebaseapp.com",
            databaseURL: "https://shirdi-project-default-rtdb.firebaseio.com",
            projectId: "shirdi-project",
            storageBucket: "shirdi-project.firebasestorage.app",
            messagingSenderId: "236969291601",
            appId: "1:236969291601:web:aca0fdad3bae8b3d10ed70",
            measurementId: "G-NN9PS51LJ8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function checkSession() {
            const session = JSON.parse(sessionStorage.getItem('shiridi_user'));
            if (session && session.perms && session.perms.admin) {
                document.getElementById('auth-modal').classList.add('hidden');
            } else {
                document.getElementById('auth-modal').classList.remove('hidden');
            }
        }

        function attemptLogin(page) {
            const u = document.getElementById('auth-userid').value.trim();
            const p = document.getElementById('auth-password').value.trim();
            if (!u || !p) return alert("Enter User ID and Password.");

            db.ref(`shiridi_settings/users/${u}`).once('value', snapshot => {
                const userData = snapshot.val();
                if (userData && userData.password === p) {
                    if (userData.perms && userData.perms[page]) {
                        sessionStorage.setItem('shiridi_user', JSON.stringify({ userId: u, perms: userData.perms }));
                        checkSession();
                    } else {
                        alert("Access Denied: You don't have permission for this module.");
                    }
                } else {
                    alert("Invalid User ID or Password.");
                }
            });
        }

        function logout() {
            sessionStorage.removeItem('shiridi_user');
            location.reload();
        }

        db.ref('shiridi_settings').on('value', snapshot => {
            const settings = snapshot.val() || {};
            document.getElementById('admin-header-title').innerText = (settings.hotelName || "Sai Krishna Caterers") + " Admin";
            document.getElementById('admin-header-logo').src = settings.hotelImage || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=120";
            
            if(document.activeElement !== document.getElementById('setup-hotel-name')) document.getElementById('setup-hotel-name').value = settings.hotelName || "";
            if(document.activeElement !== document.getElementById('setup-hotel-image')) document.getElementById('setup-hotel-image').value = settings.hotelImage || "";
            if(document.activeElement !== document.getElementById('setup-banner-image')) document.getElementById('setup-banner-image').value = settings.bannerImage || "";
            if(document.activeElement !== document.getElementById('setup-upi-id')) document.getElementById('setup-upi-id').value = settings.upiId || "";
            if(document.activeElement !== document.getElementById('setup-merchant-name')) document.getElementById('setup-merchant-name').value = settings.merchantName || "";
            if(document.activeElement !== document.getElementById('setup-qr-image')) document.getElementById('setup-qr-image').value = settings.customQrImage || "";
        });

        function saveAppIdentitySettings() {
            db.ref('shiridi_settings').update({
                hotelName: document.getElementById('setup-hotel-name').value.trim(),
                hotelImage: document.getElementById('setup-hotel-image').value.trim(),
                bannerImage: document.getElementById('setup-banner-image').value.trim(),
                upiId: document.getElementById('setup-upi-id').value.trim(),
                merchantName: document.getElementById('setup-merchant-name').value.trim(),
                customQrImage: document.getElementById('setup-qr-image').value.trim()
            }).then(() => alert("Settings updated!"));
        }

        db.ref('shiridi_menu').on('value', snapshot => {
            const data = snapshot.val();
            const container = document.getElementById('admin-menu-container');
            container.innerHTML = '';
            if(!data) return;
            Object.keys(data).forEach(key => {
                const item = data[key];
                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-gray-50 border border-gray-200 p-3 rounded-xl";
                row.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <img src="${item.image}" class="w-12 h-12 object-cover rounded-lg">
                        <div><h4 class="font-bold text-sm text-gray-900">${item.name}</h4><p class="text-red-700 text-xs font-bold">₹${item.price}</p></div>
                    </div>
                    <div class="flex space-x-2 text-xs">
                        <button onclick="editItemForm('${key}', '${item.name}', '${item.price}', '${item.image}')" class="bg-white border px-3 py-1.5 rounded font-bold">Edit</button>
                        <button onclick="deleteItem('${key}')" class="bg-red-50 text-red-700 px-3 py-1.5 rounded font-bold">Delete</button>
                    </div>`;
                container.appendChild(row);
            });
        });

        function saveItem() {
            const id = document.getElementById('item-id').value;
            const itemData = {
                name: document.getElementById('menu-name').value.trim(),
                price: document.getElementById('menu-price').value.trim(),
                image: document.getElementById('menu-image').value.trim()
            };
            if(id) db.ref(`shiridi_menu/${id}`).update(itemData).then(resetForm);
            else db.ref('shiridi_menu').push(itemData).then(resetForm);
        }

        function deleteItem(key) { if(confirm("Remove item?")) db.ref(`shiridi_menu/${key}`).remove(); }
        function editItemForm(k, n, p, i) {
            document.getElementById('item-id').value = k;
            document.getElementById('menu-name').value = n;
            document.getElementById('menu-price').value = p;
            document.getElementById('menu-image').value = i;
            document.getElementById('btn-cancel').classList.remove('hidden');
        }
        function resetForm() {
            document.getElementById('item-id').value = '';
            document.getElementById('menu-name').value = '';
            document.getElementById('menu-price').value = '';
            document.getElementById('menu-image').value = '';
            document.getElementById('btn-cancel').classList.add('hidden');
        }

        window.onload = checkSession;
    </script>
</body>
</html>
